<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Eric Gerson — Contact Me</title> 
    <style> 
        :root { 
            --bg: #111622; 
            --card: #1a202c; 
            --text: #f7fafc; 
            --muted: #a0aec0; 
            --accent: #ff6b00; 
            --border: #2d3748; 
        } 
        * { box-sizing: border-box; margin: 0; padding: 0; } 
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.6; 
            padding: 5vw; 
        } 
        
        /* Layout Wrappers */ 
        header.site-navigation-header, main, footer { max-width: 1100px; margin: 0 auto; } 

        /* ======================================================== */
        /* GLOBAL HEADER & HAMBURGER NAVIGATION STYLES              */
        /* ======================================================== */
        .site-navigation-header {
            position: relative;
            width: 100%;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
            margin-bottom: 80px;
            z-index: 1000;
        }
        .nav-container-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .nav-logo {
            font-size: 1.3rem;
            font-weight: 800;
            text-decoration: none;
            color: var(--text);
            letter-spacing: -0.03em;
        }
        .nav-logo span { color: var(--accent); }
        .menu-toggle-input { display: none; }
        .nav-links-menu { display: flex; gap: 30px; list-style: none; padding: 0; margin: 0; }
        .nav-item-link { font-size: 0.95rem; font-weight: 600; text-decoration: none; color: var(--muted); transition: color 0.2s ease; }
        .nav-item-link:hover, .nav-item-link.active { color: var(--accent); }
        .hamburger-button-label { display: none; flex-direction: column; justify-content: space-between; width: 24px; height: 18px; cursor: pointer; }
        .hamburger-line { width: 100%; height: 2px; background: var(--text); border-radius: 2px; transition: transform 0.3s ease, opacity 0.3s ease; }

        @media (max-width: 767px) {
            .site-navigation-header { padding: 15px 0; }
            .hamburger-button-label { display: flex; }
            .nav-links-menu {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: var(--card);
                border-bottom: 1px solid var(--border);
                padding: 20px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.4);
                gap: 15px;
                text-align: center;
            }
            .nav-item-link { display: block; padding: 10px 0; font-size: 1.1rem; }
            .menu-toggle-input:checked ~ .nav-links-menu { display: flex; }
            .menu-toggle-input:checked ~ .hamburger-button-label .hamburger-line:nth-child(1) { transform: translateY(8px) rotate(45deg); background: var(--accent); }
            .menu-toggle-input:checked ~ .hamburger-button-label .hamburger-line:nth-child(2) { opacity: 0; }
            .menu-toggle-input:checked ~ .hamburger-button-label .hamburger-line:nth-child(3) { transform: translateY(-8px) rotate(-45deg); background: var(--accent); }
        }

        /* ======================================================== */
        /* PREMIUM HOMEPAGE-MATCHED CONTACT PANEL LAYOUT            */
        /* ======================================================== */
        .contact-content-center {
            text-align: center;
            max-width: 800px;
            margin: 60px auto 0 auto;
            padding: 20px;
        }

        .footer-cta-headline {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 20px;
            color: var(--text);
        }

        .contact-desc-sub {
            color: var(--muted);
            font-size: clamp(1.1rem, 2vw, 1.3rem);
            margin-bottom: 50px;
        }

        .contact-grid { 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center; 
            gap: 20px; 
            margin-bottom: 40px; 
        } 

        @media (min-width: 650px) {
            .contact-grid {
                flex-direction: row; 
                gap: 30px;
            }
        }

        .contact-link { 
            color: var(--text); 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 1.05rem; 
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 30px; 
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease; 
        } 

        .link-icon {
            font-size: 1.2rem;
        }

        .contact-link:hover { 
            color: #fff;
            border-color: var(--accent);
            background: #1e2638;
            transform: translateY(-2px); 
        }

        footer { margin-top: 140px; padding-top: 40px; border-top: 1px solid var(--border); text-align: center; } 
        .copyright { color: var(--muted); font-size: 0.85rem; } 
    </style> 
</head> 
<body> 

    <!-- RESPONSIVE GLOBAL HEADER WITH HAMBURGER TOGGLE -->
    <header class="site-navigation-header">
        <div class="nav-container-inner">
            <a href="./" class="nav-logo">Eric <span>Gerson</span></a>
            <input type="checkbox" id="menu-toggle-checkbox" class="menu-toggle-input">
            <label for="menu-toggle-checkbox" class="hamburger-button-label" aria-label="Toggle Navigation Menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </label>
            <ul class="nav-links-menu">
                <li><a href="./" class="nav-item-link">Work</a></li>
                <li><a href="./about.html" class="nav-item-link">About</a></li>
                <li><a href="./capabilities.html" class="nav-item-link">Capabilities</a></li>
                <li><a href="./contact.html" class="nav-item-link active">Contact</a></li>
            </ul>
        </div>
    </header>

    <!-- CORE REPLACED ACCENT CONNECTION CANVAS -->
    <main class="contact-content-center"> 
        <h2 class="footer-cta-headline">Let’s Tell Your Story Together</h2>
        <p class="contact-desc-sub">Have a project, strategy challenge, or creative campaign to discuss? Reach out through any channel below.</p>
        
        <div class="contact-grid"> 
            <!-- Text Link -->
            <a href="sms:+19195209764" class="contact-link text-action">
                <span class="link-icon">💬</span>
                <span class="link-label">Text</span>
            </a>
            
            <!-- Email Link -->
            <a href="mailto:erg1982@gmail.com" class="contact-link email-action">
                <span class="link-icon">✉️</span>
                <span class="link-label">Email</span>
            </a>
            
            <!-- LinkedIn Link -->
            <a href="https://linkedin.com" target="_blank" rel="noopener" class="contact-link linkedin-action">
                <span class="link-icon">💼</span>
                <span class="link-label">LinkedIn</span>
            </a> 
        </div> 
    </main> 

    <footer> 
        <p class="copyright">&copy; 2026 Eric Gerson. Handcrafted securely with GitHub Pages & Porkbun.</p> 
    </footer> 
</body> 
</html>
