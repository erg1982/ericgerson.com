<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Eric Gerson — Contact Me</title> 
    <style> 
        :root { 
            --bg: #111622; 
            --card: #1a202c; 
            --text: #f7fafc; 
            --muted: #a0aec0; 
            --accent: #ff6b00; 
            --border: #2d3748; 
            --error: #ff453a;
        } 
        * { box-sizing: border-box; margin: 0; padding: 0; } 
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.6; 
            padding: 5vw; 
        } 
        
        /* Layout Wrappers */ 
        header.site-navigation-header, main, footer { max-width: 1100px; margin: 0 auto; } 

        /* ======================================================== */
        /* GLOBAL HEADER & HAMBURGER NAVIGATION STYLES              */
        /* ======================================================== */
        .site-navigation-header {
            position: relative;
            width: 100%;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
            margin-bottom: 60px;
            z-index: 1000;
        }
        .nav-container-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .nav-logo {
            font-size: 1.3rem;
            font-weight: 800;
            text-decoration: none;
            color: var(--text);
            letter-spacing: -0.03em;
        }
        .nav-logo span { color: var(--accent); }
        .menu-toggle-input { display: none; }
        .nav-links-menu { display: flex; gap: 30px; list-style: none; padding: 0; margin: 0; }
        .nav-item-link { font-size: 0.95rem; font-weight: 600; text-decoration: none; color: var(--muted); transition: color 0.2s ease; }
        .nav-item-link:hover, .nav-item-link.active { color: var(--accent); }
        .hamburger-button-label { display: none; flex-direction: column; justify-content: space-between; width: 24px; height: 18px; cursor: pointer; }
        .hamburger-line { width: 100%; height: 2px; background: var(--text); border-radius: 2px; transition: transform 0.3s ease, opacity 0.3s ease; }

        @media (max-width: 767px) {
            .site-navigation-header { padding: 15px 0; }
            .hamburger-button-label { display: flex; }
            .nav-links-menu {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: var(--card);
                border-bottom: 1px solid var(--border);
                padding: 20px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.4);
                gap: 15px;
                text-align: center;
            }
            .nav-item-link { display: block; padding: 10px 0; font-size: 1.1rem; }
            .menu-toggle-input:checked ~ .nav-links-menu { display: flex; }
            .menu-toggle-input:checked ~ .hamburger-button-label .hamburger-line:nth-child(1) { transform: translateY(8px) rotate(45deg); background: var(--accent); }
            .menu-toggle-input:checked ~ .hamburger-button-label .hamburger-line:nth-child(2) { opacity: 0; }
            .menu-toggle-input:checked ~ .hamburger-button-label .hamburger-line:nth-child(3) { transform: translateY(-8px) rotate(-45deg); background: var(--accent); }
        }

        /* ======================================================== */
        /* CONTACT PAGE WRAPPER & FORM LAYOUT LAYERS                */
        /* ======================================================== */
        .contact-layout-wrapper {
            max-width: 700px; /* Forces optimal narrow reading length for user data forms */
            margin: 0 auto;
        }

        .section-headline { 
            font-size: 2rem; 
            font-weight: 700; 
            margin-bottom: 15px; 
            border-left: 4px solid var(--accent); 
            padding-left: 15px; 
            letter-spacing: -0.02em; 
        }

        .contact-desc-sub {
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        /* Premium Form Panel */
        .premium-contact-form {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Two Column Name Flex Row Split */
        .form-row-split {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }
        @media (min-width: 600px) {
            .form-row-split {
                grid-template-columns: 1fr 1fr; /* Sideways distribution layout on screen panels */
            }
        }

        .form-group-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }
        .form-row-split .form-group-block {
            margin-bottom: 0; /* Clears bottom spacing within combined grids */
        }

        /* Explicit Form Label Styles */
        .form-group-block label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text);
        }
        .form-group-block label .required-asterisk {
            color: var(--accent);
            margin-left: 2px;
        }

        /* Base Input Fields Parameter Logic */
        .form-field-input, .form-field-textarea {
            width: 100%;
            background: #0f131a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 14px 16px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-field-textarea {
            resize: vertical; /* Blocks width breakage rules while allowing depth expansions */
            min-height: 150px;
        }

        /* Interactive User Focus Filters */
        .form-field-input:focus, .form-field-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
        }

        /* Custom Browser Built-in Form Validation Interceptor */
        .form-field-input:required:invalid:focus, 
        .form-field-textarea:required:invalid:focus {
            box-shadow: 0 0 0 3px rgba(255, 69, 58, 0.15);
        }

        /* SUBMIT BUTTON ELEMENT CODE */
        .form-submit-btn {
            width: 100%;
            background: var(--accent);
            color: #ffffff;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        .form-submit-btn:hover {
            background: #e05e00;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.3);
        }
        .form-submit-btn:active {
            transform: translateY(0);
        }

        footer { margin-top: 100px; padding-top: 40px; border-top: 1px solid var(--border); text-align: center; } 
        .copyright { color: var(--muted); font-size: 0.85rem; } 
    </style> 
</head> 
<body> 

    <!-- RESPONSIVE GLOBAL HEADER WITH HAMBURGER TOGGLE -->
    <header class="site-navigation-header">
        <div class="nav-container-inner">
            <a href="./" class="nav-logo">Eric <span>Gerson</span></a>
            <input type="checkbox" id="menu-toggle-checkbox" class="menu-toggle-input">
            <label for="menu-toggle-checkbox" class="hamburger-button-label" aria-label="Toggle Navigation Menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </label>
            <ul class="nav-links-menu">
                <li><a href="./" class="nav-item-link">Work</a></li>
                <li><a href="./resume.html" class="nav-item-link">Resume</a></li>
                <li><a href="./contact.html" class="nav-item-link active">Contact</a></li>
            </ul>
        </div>
    </header>

    <main class="contact-layout-wrapper"> 
        <h2 class="section-headline">Let’s Connect</h2>
        <p class="contact-desc-sub">Have a project, strategy challenge, or creative campaign pipeline to discuss? Drop a message below.</p>

        <!-- PURE FORM WITH ACTION METHOD AND NATIVE BROWSER ENFORCEMENTS -->
        <!-- [FORM HOSTING NOTE]: To pull live form submissions straight into your inbox without using server script languages, you can map the action target out to free tools like Formspree.io or Netlify Forms -->
        <form class="premium-contact-form" action="#" method="POST">
            
            <!-- ROW 1 split: First Name & Last Name (BOTH REQUIRED) -->
            <div class="form-row-split">
                <div class="form-group-block">
                    <label for="first-name">First Name<span class="required-asterisk">*</span></label>
                    <input type="text" id="first-name" name="first-name" class="form-field-input" placeholder="Eric" required>
                </div>
                <div class="form-group-block">
